<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML Viewer (dev)</title>

  <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 13px;
      color: #323130;
      background: #ffffff;
      padding: 16px;
    }
    h1 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 10px; }
    button {
      padding: 5px 12px;
      border: 1px solid #8a8886;
      border-radius: 2px;
      cursor: pointer;
      font-size: 13px;
      background: #ffffff;
      color: #323130;
    }
    button.primary {
      background: #0078d4;
      border-color: #0078d4;
      color: #ffffff;
    }
    button.primary:hover { background: #106ebe; }
    button:hover { background: #f3f2f1; }
    #status {
      font-size: 12px;
      color: #605e5c;
      margin-bottom: 8px;
      min-height: 18px;
    }
    #htmlOutput {
      font-family: Consolas, "Courier New", monospace;
      font-size: 11px;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 45vh;
      overflow-y: auto;
      border: 1px solid #edebe9;
      padding: 8px;
      background: #faf9f8;
      margin-bottom: 12px;
    }
    #separators h3 { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .sep-none { color: #605e5c; font-style: italic; }
    .sep-item { margin-bottom: 10px; }
    .label { color: #d83b01; font-weight: 600; font-size: 12px; margin-bottom: 2px; }
    .excerpt {
      font-family: Consolas, "Courier New", monospace;
      font-size: 11px;
      white-space: pre-wrap;
      word-break: break-all;
      border-left: 2px solid #d83b01;
      padding-left: 6px;
      background: #faf9f8;
    }
  </style>
</head>

<body>
  <h1>HTML Viewer (dev)</h1>
  <div class="toolbar">
    <button id="btnRefresh" class="primary">Refresh</button>
    <button id="btnCopy">Copy HTML</button>
    <button id="btnCopySep">Copy Separators</button>
  </div>
  <div id="status">Click Refresh to load the email HTML.</div>
  <pre id="htmlOutput"></pre>
  <div id="separators">
    <h3>Detected separators</h3>
    <div id="sepList"><span class="sep-none">No data yet.</span></div>
  </div>
</body>

</html>
